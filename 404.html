<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada</title>
<script>
  // Projetos que mudaram de sítio: os links antigos continuam a funcionar.
  var MOVED = { '/Portfolio/naruto-fillers': '/Portfolio/projetos/naruto-fillers' };
  for (var from in MOVED) {
    var p = location.pathname;
    if (p === from || p.indexOf(from + '/') === 0) {
      location.replace(MOVED[from] + p.slice(from.length) + location.search + location.hash);
    }
  }
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1a42; color: #f3f6ff;
         font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
  h1 { font-size: 3rem; margin: 0; color: #f57c00; }
  a { color: #ffa94d; }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Esta página não existe.</p>
    <p><a href="/Portfolio/">Ir para o portfólio</a></p>
  </main>
</body>
</html>
