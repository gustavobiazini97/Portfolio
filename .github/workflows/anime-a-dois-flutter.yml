# Compila a app Flutter do Anime a Dois (APK Android) no GitHub, sem precisar do Flutter instalado.
# Corre a cada push que mexa na pasta da app (ou à mão, no separador Actions).
#
# Resultado:
#   1. o APK fica nos "Artifacts" da execução;
#   2. e na release "anime-a-dois-apk", com um link fixo para descarregar no telemóvel:
#      https://github.com/gustavobiazini97/Portfolio/releases/download/anime-a-dois-apk/anime-a-dois.apk
# O APK é de release e só arm64 (telemóveis atuais).
#
# Secret opcional: ANDROID_KEYSTORE_B64 (keystore em base64, ver o README da app).
# Sem ele, cada APK é assinado com uma chave diferente e, para atualizar, é preciso desinstalar primeiro.

name: APK Anime a Dois

on:
  push:
    paths:
      - 'projetos/anime-a-dois-flutter/**'
      - '.github/workflows/anime-a-dois-flutter.yml'
  workflow_dispatch:

# Uma compilação de cada vez por ramo; uma nova cancela a anterior
concurrency:
  group: apk-anime-a-dois-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write            # para criar/atualizar a release com o APK

env:
  API_URL: https://animeadois.alwaysdata.net/api.php

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetos/anime-a-dois-flutter
    steps:
      - uses: actions/checkout@v4

      # O Gradle do Android precisa do Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache do Gradle entre execuções (as dependências do Android não são descarregadas sempre)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-anime-a-dois-${{ hashFiles('projetos/anime-a-dois-flutter/pubspec.yaml') }}
          restore-keys: gradle-anime-a-dois-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # A pasta android/ não está no Git: o "flutter create" gera-a (não mexe no lib/ nem no pubspec)
      - name: Gerar a pasta android
        run: |
          flutter create --platforms android --org pt.gustavobiazini --project-name anime_a_dois .
          # O modelo traz um teste de exemplo (contador) que não existe nesta app
          rm -f test/widget_test.dart

      # Permissão de internet (o modelo só a põe nas builds de debug) e nome visível da app
      - name: Ajustar o AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          sed -i 's|android:label="anime_a_dois"|android:label="Anime a Dois"|' "$M"
          grep -n 'INTERNET\|android:label' "$M"

      - name: Dependências
        run: flutter pub get

      - name: Ícone da app
        run: dart run flutter_launcher_icons

      # Erros de código param aqui; avisos de estilo só aparecem no log
      # Erros de código param aqui; ficam também como anotação da execução (legíveis pela API do GitHub)
      - name: Analisar o código
        run: |
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings > analise.txt 2>&1; then
            cat analise.txt
            echo "::error title=flutter analyze::$(grep -E 'error •' analise.txt | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          tail -3 analise.txt

      - name: Testes
        run: |
          if ! flutter test > testes.txt 2>&1; then
            cat testes.txt
            echo "::error title=flutter test::$(grep -iE 'error|expected|actual|failed' testes.txt | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          tail -2 testes.txt

      # Chave fixa de assinatura (se o secret existir): permite atualizar a app sem desinstalar.
      # Fica em android/app/anime.keystore e o build.gradle.kts passa a usá-la explicitamente no release.
      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::Sem ANDROID_KEYSTORE_B64 — o APK usa uma chave temporária."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/anime.keystore
          keytool -list -keystore android/app/anime.keystore -storepass android | grep -i "SHA-256"
          python3 - <<'PY'
          import re, pathlib
          g = pathlib.Path("android/app/build.gradle.kts")
          s = g.read_text()
          bloco = """    signingConfigs {
                  create("fixa") {
                      storeFile = file("anime.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {"""
          if "buildTypes {" not in s or 'signingConfigs.getByName("debug")' not in s:
              raise SystemExit("build.gradle.kts com um formato inesperado")
          s = s.replace("    buildTypes {", bloco, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("fixa")')
          g.write_text(s)
          print("Assinatura fixa configurada.")
          PY
          grep -n 'signingConfig\|anime.keystore' android/app/build.gradle.kts

      # Número da build = número da execução (o Android exige que suba a cada versão).
      # Release só para arm64 (quase todos os telemóveis atuais): uma compilação, APK pequeno
      - name: Compilar o APK (release)
        run: |
          if ! flutter build apk --release --split-per-abi --target-platform android-arm64 \
                 --dart-define=API_URL="$API_URL" \
                 --build-number=${{ github.run_number }} > build.txt 2>&1; then
            cat build.txt
            echo "::error title=flutter build::$(grep -iE 'error|exception|failed' build.txt | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          tail -3 build.txt
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk anime-a-dois.apk
          ls -la anime-a-dois.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anime-a-dois-apk
          path: projetos/anime-a-dois-flutter/anime-a-dois.apk

      # versao.json: a app lê-o ao abrir e, se o build for maior do que o dela, avisa que há versão nova.
      # As notas vêm do novidades.json (entrada com a mesma versão do pubspec).
      - name: Gerar versao.json
        run: |
          python3 - <<'PY'
          import json, re, datetime, pathlib
          versao = re.search(r'^version:\s*([0-9.]+)', pathlib.Path('pubspec.yaml').read_text(), re.M).group(1)
          novidades = json.loads(pathlib.Path('novidades.json').read_text(encoding='utf-8'))
          notas = next((n['notas'] for n in novidades if n['versao'] == versao), [])
          dados = {
              'versao': versao,
              'build': int('${{ github.run_number }}'),
              'data': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
              'notas': notas,
              'apk': 'https://animeadois.alwaysdata.net/app',
          }
          pathlib.Path('versao.json').write_text(json.dumps(dados, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(dados, ensure_ascii=False))
          PY

      # Release com link fixo (o APK é substituído a cada compilação)
      - name: Publicar na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=anime-a-dois-apk
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Anime a Dois (APK)" \
              --notes "APK da app Flutter do Anime a Dois. Atualizado automaticamente a cada compilação."
          gh release upload "$TAG" anime-a-dois.apk versao.json --clobber
          # Remove o APK arm64 antigo (deixou de ser gerado; o anime-a-dois.apk já é arm64)
          gh release delete-asset "$TAG" anime-a-dois-arm64.apk -y 2>/dev/null || true
